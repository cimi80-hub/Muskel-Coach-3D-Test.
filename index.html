<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dr. Muskel Coach V12 – Skelettanalyse</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b121b;color:#e9f2fa;font:15px system-ui,sans-serif}
header,main{padding:12px 16px;max-width:920px;margin:auto}h1{font-size:21px;margin:0 0 5px}
#view{height:48vh;min-height:300px;touch-action:none}button,select{font:inherit;background:#24394c;color:white;border:1px solid #587184;border-radius:8px;padding:10px;min-height:43px}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:10px 0}
#log{white-space:pre-wrap;overflow-wrap:anywhere;background:#162433;border:1px solid #38536a;border-radius:9px;padding:13px;font:12px/1.55 ui-monospace,monospace}
#status{color:#b9d3e5}label{display:flex;align-items:center;gap:6px}input{accent-color:#f46d70}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
</head><body><header><h1>Dr. Muskel Coach V12</h1><div id="status">Lade 3D-Grundmodell …</div></header>
<div id="view"></div>
<main><div class="row">
<label>Arm-Knochen <select id="bone"></select></label>
<label><input id="skeleton" type="checkbox" checked>Knochenlinien</label>
<button id="front">Vorne</button><button id="side">Seite</button>
<button id="copy">Diagnose kopieren</button>
</div>
<p>V12 liest die tatsächliche Knochenhierarchie und die Skinning-Einflüsse aus <code>base.glb</code>. Die Analyse verändert keine Knochen.</p>
<pre id="log">Warte auf Grundmodell …</pre>
</main>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id);
const scene=new THREE.Scene();scene.background=new THREE.Color('#0b121b');
const camera=new THREE.PerspectiveCamera(40,1,.01,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
$('view').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x526078,2.3));
const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(3,6,8);scene.add(light);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
let model,helper,bones=[],meshes=[],diagnosis='';
function pos(o){return o.getWorldPosition(new THREE.Vector3())}
function vec(v){return `(${v.x.toFixed(3)}, ${v.y.toFixed(3)}, ${v.z.toFixed(3)})`}
function fit(){
if(!model)return;
const box=new THREE.Box3().setFromObject(model),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());
const d=Math.max(size.x,size.y,size.z)*1.7;
controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(0,0,d));camera.near=.01;camera.far=1000;camera.updateProjectionMatrix();controls.update();
}
function analyze(){
if(!model)return;
model.updateMatrixWorld(true);
const name=$('bone').value;
const bone=bones.find(b=>b.name===name);
if(!bone)return;
const p=pos(bone);
const parents=[];let a=bone.parent;while(a&&parents.length<9){parents.push(`${a.name||'(ohne Name)'}${a.isBone?' [Bone]':''}`);a=a.parent}
const children=bone.children.filter(c=>c.isBone);
const local=bone.position.clone();
const childLines=children.map(c=>`  ${c.name} | lokal ${vec(c.position)} | Welt ${vec(pos(c))} | Abstand ${pos(c).distanceTo(p).toFixed(3)}`);
const lines=[
`Ausgewählt: ${bone.name}`,
`Knochen insgesamt: ${bones.length}`,
`SkinnedMeshes: ${meshes.length}`,
`Elternkette: ${parents.join(' ← ')}`,
`Position lokal: ${vec(local)}`,
`Position Welt: ${vec(p)}`,
`Quaternion lokal: (${bone.quaternion.toArray().map(x=>x.toFixed(4)).join(', ')})`,
`Kinder (${children.length}):`,
...childLines,
'',
'Skinning-Einfluss (Vertexgewichte des ausgewählten Knochens):'
];
let total=0;
for(const mesh of meshes){
const idx=mesh.skeleton.bones.indexOf(bone);
if(idx<0)continue;
const weights=mesh.geometry.getAttribute('skinWeight'),indices=mesh.geometry.getAttribute('skinIndex');
if(!weights||!indices)continue;
let count=0,weightSum=0;
for(let i=0;i<weights.count;i++){
for(let k=0;k<4;k++){if(indices.getComponent(i,k)===idx){const w=weights.getComponent(i,k);if(w>0.01){count++;weightSum+=w}}}
}
if(count){total+=count;lines.push(`  ${mesh.name||'(Mesh)'}: ${count} gewichtete Vertices; Summe ${weightSum.toFixed(1)}`)}
}
if(!total)lines.push('  Kein Einfluss > 0,01 auf untersuchte Mesh-Vertices gefunden.');
lines.push('','ARMKNOCHEN UND DIREKTE ELTERN:');
for(const b of bones.filter(b=>/upperarm|lowerarm/i.test(b.name))){
lines.push(`  ${b.name} ← ${b.parent?.name||'?'} | ${vec(pos(b))}`);
}
diagnosis=lines.join('\n');$('log').textContent=diagnosis;
}
new GLTFLoader().load('./base.glb',g=>{
model=g.scene;scene.add(model);
model.traverse(o=>{if(o.isBone)bones.push(o);if(o.isSkinnedMesh)meshes.push(o)});
model.updateMatrixWorld(true);
helper=new THREE.SkeletonHelper(model);helper.visible=$('skeleton').checked;scene.add(helper);
const arm=bones.filter(b=>/upperarm|lowerarm/i.test(b.name));
for(const b of arm){const opt=document.createElement('option');opt.value=b.name;opt.textContent=b.name;$('bone').append(opt)}
if(!arm.length){for(const b of bones.slice(0,30)){const opt=document.createElement('option');opt.value=b.name;opt.textContent=b.name;$('bone').append(opt)}}
$('bone').value=arm.find(b=>/lowerarm01L/i.test(b.name))?.name||arm[0]?.name||bones[0]?.name||'';
$('status').textContent=`Grundmodell geladen · ${bones.length} Knochen · ${meshes.length} SkinnedMeshes · ${arm.length} Armknochen`;
fit();analyze();
},undefined,e=>{$('status').textContent='Fehler beim Laden von base.glb';$('log').textContent=String(e?.message||e)+'\nPrüfe, ob base.glb im selben GitHub-Ordner wie index.html liegt.'});
$('bone').onchange=analyze;
$('skeleton').onchange=()=>{if(helper)helper.visible=$('skeleton').checked};
$('front').onclick=fit;
$('side').onclick=()=>{fit();const d=camera.position.distanceTo(controls.target);camera.position.copy(controls.target).add(new THREE.Vector3(d,0,0));controls.update()};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(diagnosis);$('status').textContent='Diagnose kopiert – hier im Chat einfügen.'}catch(e){$('status').textContent='Kopieren blockiert: Diagnose unten markieren und kopieren.'}};
function resize(){const w=$('view').clientWidth,h=$('view').clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe($('view'));resize();
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></body></html>
