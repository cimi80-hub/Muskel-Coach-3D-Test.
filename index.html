<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dr. Muskel Coach – Anatomie-Test</title><style>*{box-sizing:border-box}body{margin:0;background:#0a1017;color:#f1f6fa;font:15px system-ui}header{padding:16px;background:#15212c}h1{font-size:19px;margin:0 0 5px}small{color:#9cb2c0}#view{height:65vh;min-height:340px;touch-action:none}main{padding:12px 16px}button,select{background:#233746;border:1px solid #476073;color:white;padding:11px;border-radius:9px;font-size:14px;margin:3px}button.active{background:#a62f35}#status{color:#b6c9d5;min-height:25px}p{line-height:1.5;color:#b9c9d2}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script></head><body><header><h1>Dr. Muskel Coach – Anatomie-Test</h1><small>Anatomischer Muskelkörper · noch ohne Muskel-Rigging</small></header><div id="view"></div><main><div id="status">Lade 3D-Modelle …</div><div><button id="muscles" class="active">Muskeln</button><button id="base">Grundmodell</button><button id="both">Beide überlagern</button></div><div><select id="group"><option value="">Alle Muskeln</option><option value="biceps">Bizeps</option><option value="triceps">Trizeps</option><option value="deltoid">Schulter</option><option value="pectoralis">Brust</option><option value="latissimus">Latissimus</option><option value="quadriceps">Quadrizeps</option><option value="gastrocnemius">Wade</option></select><button id="reset">Ansicht zurücksetzen</button></div><p>Mit einem Finger drehen, mit zwei Fingern zoomen. Dies ist ein Anatomie-Test; Übungsanimationen benötigen noch die Verbindung der Muskeln mit dem Skelett.</p></main><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const host=document.getElementById('view'),status=document.getElementById('status');
window.addEventListener('error',e=>status.textContent='JavaScript-Fehler: '+e.message);
window.addEventListener('unhandledrejection',e=>status.textContent='Ladefehler: '+(e.reason?.message||e.reason));
const scene=new THREE.Scene();scene.background=new THREE.Color('#0a1017');scene.add(new THREE.HemisphereLight(0xffffff,0x28303c,2.3));const lamp=new THREE.DirectionalLight(0xffffff,2.5);lamp.position.set(3,7,6);scene.add(lamp);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(40,1,.01,1000),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
let muscle=null,base=null,mode='muscles';const original=new Map();
function fit(){const obj=mode==='base'?base:muscle||base;if(!obj)return;const b=new THREE.Box3().setFromObject(obj);const sz=b.getSize(new THREE.Vector3()),center=b.getCenter(new THREE.Vector3());controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(0,sz.y*.12,Math.max(sz.y*1.5,sz.x*2.5,.5)));camera.near=Math.max(.001,sz.y/1000);camera.far=Math.max(100,sz.y*30);camera.updateProjectionMatrix();controls.update()}
function setMode(m){mode=m;if(muscle)muscle.visible=m!=='base';if(base)base.visible=m!=='muscles';for(const id of ['muscles','base','both'])document.getElementById(id).classList.toggle('active',id===m);fit()}
function highlight(){if(!muscle)return;const q=document.getElementById('group').value;muscle.traverse(o=>{if(!o.isMesh)return;const orig=original.get(o.uuid);if(!orig)return;const mat=orig.clone();if(q&&mat.color){const yes=o.name.toLowerCase().includes(q);mat.color.set(yes?0xffb447:0x763d3d);mat.transparent=!yes;mat.opacity=yes?1:.23}o.material=mat})}
for(const id of ['muscles','base','both'])document.getElementById(id).onclick=()=>setMode(id);document.getElementById('group').onchange=highlight;document.getElementById('reset').onclick=fit;
function resize(){const w=host.clientWidth,h=host.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}new ResizeObserver(resize).observe(host);resize();renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
const loader=new GLTFLoader();Promise.all([loader.loadAsync('./muscles.glb'),loader.loadAsync('./base.glb')]).then(([a,b])=>{muscle=a.scene;base=b.scene;scene.add(muscle,base);muscle.traverse(o=>{if(o.isMesh){const mat=Array.isArray(o.material)?o.material[0]:o.material;original.set(o.uuid,mat.clone())}});setMode('muscles');status.textContent='Beide 3D-Modelle geladen. Muskelkörper sichtbar.'}).catch(e=>{status.textContent='Fehler beim Laden: '+e.message;console.error(e)});
</script></body></html>
